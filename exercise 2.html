<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>
body{
text-align:center;
}
h1{
background-color:yellow;
color:blue;
}
body{
background-color:pink;

}

</style>
</head>

<body>
<h1>Student Registration Form</h1>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter Your Name"required><br><br>

<label>Email</label>
<input type="email" placeholder="Enter Your Email"required><br><br>



<label>Password</label>
<input type="password"placeholder="Enter Your Password"required><br><br>



<label>Date Of Birth</label>
<input type="date"placeholder="Enter Your Birth Date"required><br><br>

<label>Address</label>
<input type="text-area"placeholder="Enter Your Address"required><br><br>


<input type="radio"name="gender">Male
<input type="radio"name="gender">Female

<br><br>


<input type="submit"value="register">
<input type="reset"value="clear">

</form>
</body>
</html>
