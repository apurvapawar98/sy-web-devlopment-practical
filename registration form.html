<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
form,table{
border:1px solid blue;
background:red;
</style>

</head>

<body>

<h2> Student Registration Form </h2> 

<form>

<label>Full Name:</label><br>
<input type="text" placeholder="Enter your full name" required><br><br>

<label>Email:</label>
<input type="text" placeholder="Enter your email" required><br><br>


<label>Password:</label>
<input type="text" placeholder="Enter your password" required><br><br>


<label>Mobile Number:</label>
<input type="text" placeholder="Enter your Mobile Number" required><br><br>


<label>Date Of Birth:</label>
<input type="text" placeholder="date" required><br><br>

<label>Gender:</label><br>
<input type="radio name="gender>Male
<input type="radio name="gender>Female
<input type="radio name="gender>Other

<br><br>
<label>Course:</label><br>
<select>
<option>Select Course</option>
<option>Computer Engineering</option>
<option>Informational Technology</option>
<option>Mechanical Engineering</option>
<option>Electronics Engineering</option>
</select>

<br><br>

<label>Skills:</label><br>
<input type="checkbox">HTML
<input type="checkbox">CSS
<input type="checkbox">JavaScript
<input type="checkbox">React

<br><br>

<label>Address:</label><br>
<textarea rows="4" cols="40" placeholder="Enter your address"></textarea>

<br><br>
<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>


</body>
</html>
